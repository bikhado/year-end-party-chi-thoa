<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIFF VN - Premium Event Slideshow</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Background Layers -->
        <div id="bg-fill"></div>
        <div id="bg-layer"></div>
        <div id="overlay-texture"></div>
        
        <!-- Global Frame -->
        <div id="global-frame"></div>

        <!-- Slides Container -->
        <div id="slides-container">
            <!-- Dynamic Content Injected Here -->
        </div>

        <!-- Controls (Hidden by default, used for dev/manual) -->
        <div id="controls">
            <button id="btn-prev">Prev</button>
            <button id="btn-pause">Pause</button>
            <button id="btn-next">Next</button>
        </div>
        
        <!-- Music Control -->
        <button id="music-toggle">stopped</button>
    </div>

    <!-- Templates -->
    <template id="slide-template">
        <div class="slide">
            <div class="slide-content"></div>
        </div>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script type="module" src="./main.js"></script>
</body>
</html>
